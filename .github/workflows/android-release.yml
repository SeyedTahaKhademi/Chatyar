name: Android CI/CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 0.1.0)'
        required: false
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Prepare APK
        id: prep
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VERSION="${TAG#v}"
          cp app/build/outputs/apk/debug/app-debug.apk "Chatyar-v${VERSION}.apk"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: Chatyar ${{ steps.prep.outputs.tag }}
          files: Chatyar-*.apk
          generate_release_notes: true
          body: |
            ## چتیار ${{ steps.prep.outputs.tag }}

            ### نصب
            فایل APK پیوست شده را دانلود و روی گوشی اندرویدی خود نصب کنید.

            ### حداقل نیازمندی
            - اندروید ۸.۰ (API 26) یا بالاتر
