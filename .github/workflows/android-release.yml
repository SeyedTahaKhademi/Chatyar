name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, for example 0.2.0'
        required: true
        default: '0.2.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x ./gradlew
      - name: Build APK
        run: ./gradlew --no-daemon clean assembleDebug
      - name: Prepare APK
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then TAG="v${{ inputs.version }}"; else TAG="${{ github.ref_name }}"; fi
          VERSION="${TAG#v}"
          APK_NAME="Chatyar-v${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Chatyar-Android-${{ steps.meta.outputs.version }}
          path: ${{ steps.meta.outputs.apk }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Chatyar ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.meta.outputs.apk }}
